<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD → Telegram HTML</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p  { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }

    .editor {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .pane label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }

    textarea {
      width: 100%;
      height: 320px;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 0.875rem;
      line-height: 1.5;
      resize: vertical;
      background: #fff;
    }

    textarea:focus { outline: none; border-color: #2563eb; }
    textarea[readonly] { background: #fafafa; color: #444; }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
      width: 100%;
      max-width: 900px;
    }

    button {
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #convertBtn {
      background: #2563eb;
      color: #fff;
    }
    #convertBtn:hover { background: #1d4ed8; }

    #copyBtn {
      background: #e5e7eb;
      color: #333;
    }
    #copyBtn:hover { background: #d1d5db; }

    @media (max-width: 768px) {
      .editor { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MD → Telegram HTML</h1>
    <p>Convert Markdown to Telegram-compatible HTML tags</p>
  </header>

  <div class="editor">
    <div class="pane">
      <label for="input">Input (Markdown)</label>
      <textarea id="input" placeholder="Paste Markdown here..."></textarea>
    </div>
    <div class="pane">
      <label for="output">Output (HTML)</label>
      <textarea id="output" readonly placeholder="HTML output will appear here..."></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="convertBtn">Convert</button>
    <button id="copyBtn">Copy</button>
  </div>

  <script>
    // conversion logic goes here (Task 2)
    // button wiring goes here (Task 3)
  </script>
</body>
</html>
