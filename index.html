<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD → Telegram HTML</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p  { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }

    .editor {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .pane label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }

    textarea {
      width: 100%;
      height: 320px;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 0.875rem;
      line-height: 1.5;
      resize: vertical;
      background: #fff;
    }

    textarea:focus { outline: none; border-color: #2563eb; }
    textarea[readonly] { background: #fafafa; color: #444; }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
      width: 100%;
      max-width: 900px;
    }

    button {
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #convertBtn {
      background: #2563eb;
      color: #fff;
    }
    #convertBtn:hover { background: #1d4ed8; }

    #copyBtn {
      background: #e5e7eb;
      color: #333;
    }
    #copyBtn:hover { background: #d1d5db; }

    @media (max-width: 768px) {
      .editor { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MD → Telegram HTML</h1>
    <p>Convert Markdown to Telegram-compatible HTML tags</p>
  </header>

  <div class="editor">
    <div class="pane">
      <label for="input">Input (Markdown)</label>
      <textarea id="input" placeholder="Paste Markdown here..."></textarea>
    </div>
    <div class="pane">
      <label for="output">Output (HTML)</label>
      <textarea id="output" readonly placeholder="HTML output will appear here..."></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="convertBtn">Convert</button>
    <button id="copyBtn">Copy</button>
  </div>

  <script>
    function convert(text) {
      let out = text;

      // 1. Links: [text](url) → <a href="url">text</a>
      out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

      // 2. Bold: **text** → <b>text</b>
      out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

      // 3. Italic: *text* → <i>text</i>  (single asterisk, not touching **)
      out = out.replace(/(?<!\*)\*(?!\*)([^*]+?)(?<!\*)\*(?!\*)/g, '<i>$1</i>');

      // 4. Italic: _text_ only at word boundaries (not inside snake_case)
      out = out.replace(/(^|[^\w])_([^_]+?)_(?=[^\w]|$)/gm, '$1<i>$2</i>');

      // 5. Strikethrough: ~~text~~ → <s>text</s>
      out = out.replace(/~~([^~]+)~~/g, '<s>$1</s>');

      // 6. Inline code: `code` → <code>code</code>
      out = out.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Paragraph spacing: blank lines preserved as-is (Telegram renders them with spacing)
      // No transformation needed — \n\n is already in the string.

      return out;
    }

    function runTests() {
      const cases = [
        { input: '[Click here](https://example.com)', expected: '<a href="https://example.com">Click here</a>' },
        { input: '**bold text**',                     expected: '<b>bold text</b>' },
        { input: '*italic text*',                     expected: '<i>italic text</i>' },
        { input: 'before _italic_ after',             expected: 'before <i>italic</i> after' },
        { input: 'some_snake_case',                   expected: 'some_snake_case' },
        { input: '~~struck~~',                        expected: '<s>struck</s>' },
        { input: '`inline code`',                     expected: '<code>inline code</code>' },
        { input: 'line one\n\nline two',              expected: 'line one\n\nline two' },
        { input: '(_italic_)',                        expected: '(<i>italic</i>)' },
      ];

      let passed = 0;
      cases.forEach(({ input, expected }) => {
        const result = convert(input);
        if (result === expected) {
          passed++;
        } else {
          console.error(`FAIL\n  input:    ${JSON.stringify(input)}\n  expected: ${JSON.stringify(expected)}\n  got:      ${JSON.stringify(result)}`);
        }
      });
      console.log(`Tests: ${passed}/${cases.length} passed`);
    }

    runTests();

    // button wiring goes here (Task 3)
  </script>
</body>
</html>
